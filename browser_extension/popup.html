<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cyber Raksha AI — Web Shield</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace, sans-serif;
    }
    body {
      width: 360px;
      background-color: #050811;
      color: #f0f6fc;
      padding: 14px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e2e5c;
      padding-bottom: 10px;
      margin-bottom: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-icon {
      width: 24px;
      height: 24px;
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid #00f0ff;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #00f0ff;
      font-size: 11px;
    }
    .brand-name {
      font-weight: bold;
      letter-spacing: 0.5px;
      font-size: 13px;
      color: #fff;
    }
    .badge-stage {
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(0,240,255,0.15);
      color: #00f0ff;
      border: 1px solid rgba(0,240,255,0.3);
    }
    .status-pill {
      font-size: 10px;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      border-radius: 12px;
      background: rgba(16,185,129,0.1);
      color: #34d399;
      border: 1px solid rgba(16,185,129,0.3);
      font-weight: 500;
    }
    .status-pill.offline {
      background: rgba(239,68,68,0.1);
      color: #f87171;
      border-color: rgba(239,68,68,0.3);
    }
    .telemetry-card {
      background: #0d1224;
      border: 1px solid #1e2e5c;
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
    }
    .telemetry-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    .telemetry-title {
      font-size: 11px;
      font-weight: 600;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .telemetry-rules-count {
      font-size: 10px;
      font-family: monospace;
      color: #34d399;
      background: rgba(52, 211, 153, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(52, 211, 153, 0.2);
    }
    .telemetry-meta {
      font-size: 10px;
      color: #8b949e;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn-sync-small {
      background: rgba(0, 240, 255, 0.1);
      border: 1px solid rgba(0, 240, 255, 0.3);
      color: #00f0ff;
      border-radius: 4px;
      font-size: 9px;
      padding: 2px 6px;
      cursor: pointer;
      font-weight: 500;
    }
    .btn-sync-small:hover {
      background: rgba(0, 240, 255, 0.2);
    }
    .section-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #8b949e;
      margin-bottom: 6px;
      display: block;
    }
    .current-url-box {
      background: #0d1224;
      border: 1px solid #1e2e5c;
      border-radius: 6px;
      padding: 8px;
      font-size: 11px;
      color: #c9d1d9;
      word-break: break-all;
      max-height: 48px;
      overflow-y: auto;
      margin-bottom: 10px;
      font-family: monospace;
    }
    .btn {
      width: 100%;
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #00f0ff;
      color: #000;
    }
    .btn-primary:hover {
      background: #38bdf8;
    }
    .btn-secondary {
      background: transparent;
      border: 1px solid #30363d;
      color: #c9d1d9;
      margin-top: 6px;
    }
    .btn-secondary:hover {
      border-color: #8b949e;
      background: rgba(255,255,255,0.02);
    }
    .manual-input {
      width: 100%;
      background: #0d1224;
      border: 1px solid #1e2e5c;
      border-radius: 6px;
      padding: 8px;
      font-size: 11px;
      color: #fff;
      margin-bottom: 6px;
    }
    .manual-input:focus {
      outline: none;
      border-color: #00f0ff;
    }
    .result-panel {
      margin-top: 12px;
      background: #0d1224;
      border-radius: 6px;
      border: 1px solid #1e2e5c;
      padding: 10px;
      display: none;
    }
    .result-panel.visible {
      display: block;
    }
    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .verdict-badge {
      font-size: 10px;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .verdict-high {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
      border: 1px solid #ef4444;
    }
    .verdict-med {
      background: rgba(245, 158, 11, 0.2);
      color: #f59e0b;
      border: 1px solid #f59e0b;
    }
    .verdict-low {
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
      border: 1px solid #10b981;
    }
    .result-explanation {
      font-size: 11px;
      color: #8b949e;
      margin-bottom: 6px;
      line-height: 1.4;
    }
    .result-recommendation {
      font-size: 11px;
      color: #c9d1d9;
      background: #050811;
      padding: 6px;
      border-radius: 4px;
      border-left: 2px solid #00f0ff;
    }
    .footer {
      margin-top: 14px;
      padding-top: 8px;
      border-top: 1px solid #1e2e5c;
      display: flex;
      justify-content: space-between;
      font-size: 10px;
    }
    .footer a {
      color: #00f0ff;
      text-decoration: none;
    }
    .footer a:hover {
      text-decoration: underline;
    }
    .loading-spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid #000;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="brand-icon">CR</div>
      <div>
        <div class="brand-name">CYBER RAKSHA</div>
      </div>
      <span class="badge-stage">AI</span>
    </div>
    <div id="statusPill" class="status-pill">
      <span>●</span>
      <span id="statusText">CONNECTING...</span>
    </div>
  </div>

  <!-- Real-Time Automated Protection Telemetry -->
  <div class="telemetry-card">
    <div class="telemetry-header">
      <span class="telemetry-title">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        Declarative Threat Shield
      </span>
      <span id="rulesCountBadge" class="telemetry-rules-count">0 Rules Active</span>
    </div>
    <div class="telemetry-meta">
      <span id="syncStatusLabel">Threat Feed: Syncing...</span>
      <button id="btnSyncNow" class="btn-sync-small">Sync Feed</button>
    </div>
  </div>

  <div>
    <span class="section-title">Active Webpage URL</span>
    <div id="currentUrlBox" class="current-url-box">Reading browser tab...</div>
    <button id="btnScanCurrent" class="btn btn-primary">
      <span id="scanBtnText">Scan Current Page URL</span>
    </button>
  </div>

  <div style="margin-top: 12px;">
    <span class="section-title">Manual Link Inspection</span>
    <input id="manualUrlInput" type="text" class="manual-input" placeholder="https://example.com/login" />
    <button id="btnScanManual" class="btn btn-secondary">Analyze Specific Link</button>
  </div>

  <div id="resultPanel" class="result-panel">
    <div class="result-header">
      <span id="verdictBadge" class="verdict-badge verdict-low">LOW RISK</span>
      <span id="scoreText" style="font-size: 11px; color: #fff; font-weight: bold;">0.0/100</span>
    </div>
    <div id="resultExplanation" class="result-explanation">Explanation loading...</div>
    <div id="resultRecommendation" class="result-recommendation">Recommendation loading...</div>
  </div>

  <div class="footer">
    <a href="#" id="openDashboard">Open Full Dashboard ↗</a>
    <a href="#" id="openSettings">Extension Settings</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
